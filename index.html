<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>無知の知チャレンジ</title>
    <meta name="description" content="「む」「ち」「の」から 4 文字を選んで並べるだけのサイト">
    <style>
      :root {
        --bg: #fbfaf7;
        --fg: #1a1a1a;
        --accent: #c8102e;
        --button-bg: #1a1a1a;
        --button-fg: #fbfaf7;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141414;
          --fg: #f2f0ea;
          --accent: #ff5a4a;
          --button-bg: #f2f0ea;
          --button-fg: #141414;
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        height: 100%;
      }

      html {
        background: var(--bg);
      }

      body {
        display: flex;
        flex-direction: column;
        height: 100dvh;
        background: var(--bg);
        color: var(--fg);
        font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
        overflow: hidden;
      }

      #lines {
        position: fixed;
        inset: -50%;
        background: repeating-conic-gradient(var(--fg) 0deg 1.2deg, transparent 1.2deg 7deg);
        mask-image: radial-gradient(circle, transparent 22%, #000 60%);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
      }

      #lines.active {
        opacity: 0.18;
        animation: rotate 6s linear infinite;
      }

      #lines.reach {
        opacity: 0.4;
        animation-duration: 0.9s;
      }

      #lines.jackpot {
        background: repeating-conic-gradient(var(--accent) 0deg 2deg, transparent 2deg 7deg);
        opacity: 0.35;
        animation-duration: 3s;
      }

      @keyframes rotate {
        to {
          transform: rotate(360deg);
        }
      }

      header {
        position: relative;
        padding: calc(12px + env(safe-area-inset-top)) 16px 0;
        text-align: center;
      }

      header h1 {
        font-size: clamp(18px, 4vmin, 32px);
        font-weight: 700;
        letter-spacing: 0.3em;
        text-indent: 0.3em;
      }

      body.jackpot header h1 {
        color: var(--accent);
      }

      #stage {
        position: relative;
        flex: 1;
        min-height: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      #word {
        display: grid;
        line-height: 1;
        font-weight: 700;
      }

      #word span {
        display: block;
        width: 1em;
        height: 1em;
        text-align: center;
      }

      #word span.spinning {
        filter: blur(0.02em);
        animation: jitter 0.08s steps(2) infinite;
      }

      #word.charging span {
        animation: jitter 0.05s steps(2) infinite;
      }

      @keyframes jitter {
        0% {
          transform: translate(-3%, 2%) rotate(-2deg);
        }
        50% {
          transform: translate(3%, -2%) rotate(2deg);
        }
        100% {
          transform: translate(-2%, -3%) rotate(-1deg);
        }
      }

      body.jackpot #word {
        color: var(--accent);
      }

      #stamp {
        position: absolute;
        padding: 0.15em 0.3em;
        border: 0.08em solid var(--accent);
        border-radius: 0.1em;
        background: var(--bg);
        color: var(--accent);
        font-size: min(16vw, 16vh);
        font-weight: 700;
        line-height: 1.1;
        white-space: nowrap;
        rotate: -12deg;
      }

      #stamp[hidden] {
        display: none;
      }

      footer {
        position: relative;
        display: flex;
        justify-content: center;
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      }

      #regenerate {
        min-width: 160px;
        padding: 12px 24px;
        border: none;
        border-radius: 999px;
        background: var(--button-bg);
        color: var(--button-fg);
        font: inherit;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
      }

      #regenerate:disabled {
        cursor: progress;
      }

      #regenerate.reach {
        background: var(--accent);
        color: var(--bg);
        animation: pulse 0.3s ease-in-out infinite alternate;
      }

      @keyframes pulse {
        to {
          transform: scale(1.15);
        }
      }

      #regenerate:focus-visible {
        outline: 3px solid var(--fg);
        outline-offset: 3px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
    </style>
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <div id="lines"></div>
    <header>
      <h1>無知の知チャレンジ</h1>
    </header>
    <main id="stage">
      <div id="word"><span>む</span><span>ち</span><span>の</span><span>ち</span></div>
      <p id="stamp" aria-hidden="true" hidden>無知の知</p>
    </main>
    <footer>
      <button id="regenerate" type="button">もういちど</button>
      <p id="status" class="sr-only" aria-live="polite"></p>
    </footer>
  </body>
</html>
